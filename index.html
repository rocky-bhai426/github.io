<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Mahadev Photo Frame</title>

<style>
*{
  box-sizing:border-box;
}

body{
  margin:0;
  font-family:Arial,sans-serif;
  background:#f5f5f5;
  color:#222;
}

header{
  background:#111;
  color:white;
  padding:16px 20px;
  display:flex;
  align-items:center;
  justify-content:space-between;
}

.logo{
  font-size:24px;
  font-weight:bold;
  color:#ffd21c;
}

nav a{
  color:white;
  text-decoration:none;
  margin-left:18px;
}

.hero{
  text-align:center;
  padding:40px 20px;
  background:white;
}

.hero h1{
  font-size:34px;
  margin:10px 0;
}

.highlight{
  color:#e00000;
}

.hero p{
  font-size:19px;
  color:#555;
}

.btn{
  display:inline-block;
  background:#008000;
  color:white;
  text-decoration:none;
  padding:14px 25px;
  border-radius:30px;
  font-weight:bold;
  margin-top:10px;
}

section{
  max-width:1100px;
  margin:auto;
  padding:35px 20px;
}

h2{
  text-align:center;
  font-size:30px;
}

.cards{
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(180px,1fr));
  gap:18px;
}

.card{
  background:white;
  padding:22px;
  border-radius:16px;
  text-align:center;
  box-shadow:0 4px 18px #ddd;
}

.card h3{
  margin-bottom:10px;
}

.order{
  background:#111;
  color:white;
  border-radius:20px;
  text-align:center;
  padding:30px 20px;
}

.order .btn{
  background:#00a884;
}

footer{
  text-align:center;
  padding:25px;
  color:#666;
}

  nav{
    display:none;
  }

  .hero h1{
    font-size:28
